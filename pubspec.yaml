name: trickcal_note_revive
description: "트릭컬노트: 리바이브"
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fluttertoast: ^9.0.0

  flutter_riverpod: ^3.0.0
  supabase_flutter: ^2.10.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  collection: ^1.19.1
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  custom_lint:
  flutter_lints: ^5.0.0
  riverpod_lint: ^3.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sados/
    - assets/icons/
    - .env

  fonts:
    - family: OneMobilePop
      fonts:
        - asset: assets/fonts/One-Mobile-POP.ttf